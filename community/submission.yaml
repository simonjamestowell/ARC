    twitter: https://x.com/simonyakatowell

description: >
  YAKA is a provider-free deterministic world model agent built on the
  Oppositional Vector Strategy framework and Hive reasoning engine. It solves
  the three public ARC-AGI-3 games through game-specific world models and
  constraint-ordered execution at $0.00 provider cost.

